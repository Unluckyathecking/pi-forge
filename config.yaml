# Pi Forge harness configuration.
# Values here are merged over the built-in defaults, then over FORGE_* env vars.

forge:
  version: "1.0.0"
  name: "pi-forge"
  description: "Proof-carrying, hexagonal-core, multi-level autonomous coding factory"

# ──────────────────────────────────────────────────────────────────────────────
# CORE ORCHESTRATION
# ──────────────────────────────────────────────────────────────────────────────

core:
  # Hexagonal architecture: core never depends directly on tools, models, or git
  architecture: "hexagonal"
  
  # Multi-level abstraction ladder
  levels:
    l0_project:
      scope: "Project/repo scaffolding"
      max_lines: 10000
      agent_pool: 2
    l1_module:
      scope: "Module/component generation"
      max_lines: 2000
      agent_pool: 3
    l2_function:
      scope: "Function/class implementation"
      max_lines: 300
      agent_pool: 2
    l3_line:
      scope: "Line-level refactoring"
      max_lines: 50
      agent_pool: 1

  # Escalation rules
  escalation:
    auto_escalate: true
    human_pause_on:
      - "public_api_change"
      - "schema_migration"
      - "auth_change"
      - "deployment_topology_change"
      - "security_posture_change"
      - "data_deletion"
      - "dependency_major_upgrade"
    max_escalation_depth: 3

# ──────────────────────────────────────────────────────────────────────────────
# PROOF-CARRYING PIPELINE
# ──────────────────────────────────────────────────────────────────────────────

proof_carrying:
  enabled: true
  # Gates that must pass before a task can be marked complete
  required_gates:
    - lint
    - typecheck
    - test
    - build
    - security_scan
  
  # Gates that are checked but don't block
  advisory_gates:
    - contract_verify
    - diff_review
  
  # Proof artifact settings
  artifact:
    schema: "./schemas/proof-artifact.json"
    required_claims_min: 3
    max_output_excerpt_length: 2000
    persist_path: ".pi/evidence/{goal_id}/proofs/"

# ──────────────────────────────────────────────────────────────────────────────
# GIT INTEGRATION
# ──────────────────────────────────────────────────────────────────────────────

git:
  # Branch naming
  branch_prefix: "pi/"
  session_branch_template: "pi/session/{date}-{goal_slug}"
  task_branch_template: "pi/task/{task_id}-{slug}"
  
  # Worktree isolation
  worktree_base: ".pi/worktrees/"
  auto_clean_worktrees: true
  retain_failed_branches: true
  # When true, the orchestrator preserves the worktree on gate failure
  # (skips destroyWorktree) so operators can inspect/recover. Default
  # false. Overridable per-run from the CLI via --keep-on-fail.
  preserve_worktree_on_failure: false
  # What to do with a worktree whose task failed gates.
  #   "purge"          → destroy worktree + branch (the default)
  #   "preserve"       → auto-commit dirty, tag at refs/forge/failed/<g>/<t>,
  #                       rename worktree to <path><suffix>, write sidecar
  #                       marker. Inspect with `pi-forge inspect <task-id>`,
  #                       salvage with `pi-forge salvage`, purge with
  #                       `pi-forge cleanup --failed`.
  #   "tag-and-purge"  → tag the dirty SHA but destroy the worktree
  #                       (lightweight; tag survives for later checkout).
  # Setting preserve_worktree_on_failure: true above is shorthand for
  # failed_task_behavior: "preserve".
  failed_task_behavior: "purge"
  # Suffix for renamed failed worktrees. Collisions get a unix-timestamp suffix.
  failed_worktree_suffix: ".failed"
  # Operator-defined shell-script hooks. Best-effort: failures log a
  # warning but never abort pi-forge. Available env vars (all hooks):
  #   PI_FORGE_TASK_ID, PI_FORGE_GOAL_ID, PI_FORGE_BRANCH,
  #   PI_FORGE_WORKTREE, PI_FORGE_TIMESTAMP
  # Failure hook extras:
  #   PI_FORGE_FAILED_GATES (comma list), PI_FORGE_TAG_REF,
  #   PI_FORGE_COMMIT_SHA, PI_FORGE_FAILURE_REASON
  # Success hook extras:
  #   PI_FORGE_COMMIT_SHA, PI_FORGE_DURATION_SECONDS
  hooks: {}
  # Example:
  # hooks:
  #   on_task_failed: "./scripts/on-fail.sh"
  #   on_task_completed: "./scripts/on-success.sh"
  archive_after_days: 7
  
  # Commit policy
  commit:
    require_conventional_commits: true
    include_task_id: true
    include_evidence_summary: true
    max_commit_size_lines: 500
  
  # Merge policy
  merge:
    strategy: "rebase"
    require_linear_history: true
    squash_on_merge: false

# ──────────────────────────────────────────────────────────────────────────────
# AGENT ROLES & CAPABILITIES
# ──────────────────────────────────────────────────────────────────────────────

agents:
  # Baseline roles with capability tags
  roles:
    coordinator:
      description: "Orchestrates decomposition, delegation, and integration"
      capabilities:
        - "plan.decompose"
        - "plan.delegate"
        - "plan.integrate"
        - "git.worktree"
        - "git.branch"
        - "git.merge"
      max_concurrent_tasks: 8
      
    planner:
      description: "Decomposes goals into task graphs with proof requirements"
      capabilities:
        - "plan.decompose"
        - "plan.estimate"
        - "contract.draft"
        - "analysis.impact"
      max_concurrent_tasks: 2
      
    coder:
      description: "Implements scoped tasks in isolated worktrees"
      capabilities:
        - "code.implement"
        - "code.test"
        - "code.refactor"
        - "code.document"
        - "tool.lint"
        - "tool.typecheck"
      max_concurrent_tasks: 4
      
    reviewer:
      description: "Adversarial review of design, edge cases, and maintainability"
      capabilities:
        - "review.design"
        - "review.security"
        - "review.performance"
        - "review.accessibility"
      max_concurrent_tasks: 2
      
    qa:
      description: "Writes and runs tests, reproduces bugs"
      capabilities:
        - "test.unit"
        - "test.integration"
        - "test.e2e"
        - "test.reproduce"
      max_concurrent_tasks: 3
      
    security:
      description: "Checks secrets, trust boundaries, injection paths"
      capabilities:
        - "security.secrets"
        - "security.injection"
        - "security.dependencies"
        - "security.threat_model"
      max_concurrent_tasks: 2
      
    integrator:
      description: "Merges workstreams and resolves conflicts"
      capabilities:
        - "git.merge"
        - "git.conflict_resolve"
        - "test.integration"
        - "verify.cross_module"
      max_concurrent_tasks: 2

  # Capability-based routing overrides role-based when enabled
  capability_routing:
    enabled: false
    registry_path: ".pi/capabilities/"
    fallback_role: "coder"

# ──────────────────────────────────────────────────────────────────────────────
# QUALITY GATES
# ──────────────────────────────────────────────────────────────────────────────

gates:
  # Mechanical gates run before any agent review
  mechanical:
    order:
      - lint
      - typecheck
      - test
      - build
      - security_scan
    
    lint:
      enabled: true
      fail_on_error: true
      auto_fix: false
    
    typecheck:
      enabled: true
      fail_on_error: true
    
    test:
      enabled: true
      require_pass: true
      timeout_seconds: 300
      coverage_threshold: 80  # Percent
    
    build:
      enabled: true
      fail_on_error: true
      timeout_seconds: 300
    
    security_scan:
      enabled: true
      checks:
        - secrets
        - dependency_vulnerabilities
        - injection_patterns
        - suspicious_network
      fail_on_critical: true

  # Not enforced. The schema requires this block, but nothing reads it:
  # LocalCommandVerifier.scoreRisk uses its own built-in deny list and its
  # own diff-size limits. See src/adapters/verifier.ts. The lists are left
  # empty rather than populated so this does not read as an active policy.
  review:
    diff_max_lines: 1000
    diff_max_files: 50
    deny_patterns: []
    protected_files: []

  # Not enforced either. scoreRisk computes its score and picks its decision
  # from thresholds hardcoded in src/adapters/verifier.ts; these numbers are
  # validated and then ignored.
  risk:
    weights:
      policy_violations: 0.30
      suspicious_patterns: 0.25
      test_failures: 0.20
      contract_drift: 0.15
      diff_size_anomaly: 0.10

    thresholds:
      auto_promote: 25
      user_confirm: 50
      security_review: 75
      auto_deny: 90

# ──────────────────────────────────────────────────────────────────────────────
# STATE & RECOVERY
# ──────────────────────────────────────────────────────────────────────────────

state:
  # Not configurable. The CLI passes a fixed ".pi/state" root to the state
  # adapter (src/cli/index.ts), which derives its own subdirectories from it.
  paths: {}

  # Checkpoint policy
  checkpoints:
    auto_write_before:
      - "subagent_spawn"
      - "long_running_task"
      - "destructive_operation"
    max_checkpoints_per_goal: 50
    compress_after_days: 30

# ──────────────────────────────────────────────────────────────────────────────
# HUMAN APPROVAL BOUNDARIES
# ──────────────────────────────────────────────────────────────────────────────

approval:
  auto_approve:
    - "l3_refactoring"
    - "test_addition"
    - "documentation"
    - "l2_implementation_with_passing_gates"
  
  require_confirm:
    - "l1_module_creation"
    - "dependency_addition"
    - "public_api_change"
  
  require_review:
    - "l0_project_scaffolding"
    - "auth_change"
    - "security_posture_change"
    - "deployment_topology_change"
    - "high_risk_branch"
