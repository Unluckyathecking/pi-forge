name: Feature request
description: Propose an improvement to Pi Forge
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow is blocked or unnecessarily difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility impact
      options:
        - Additive / backward compatible
        - May require migration
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: participation
    attributes:
      label: Participation
      options:
        - label: I would be willing to help implement or test this change.
