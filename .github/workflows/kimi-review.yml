name: Kimi Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# Cancel any in-progress run when a fresh commit lands on the same PR so we
# don't burn Kimi tokens on already-superseded SHAs.
concurrency:
  group: kimi-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The reviewer is informational and autofix is disabled. It needs issues:write
# only to post the claude:suggested-merge handoff comment after a clean review.
permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

jobs:
  kimi-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Check out the actual PR head branch (not the merge commit) so the
          # autofix step can git push back to it.
          ref: ${{ github.event.pull_request.head.ref }}
          # Full history so `git log --grep` can count prior kimi-autofix commits.
          fetch-depth: 0
      - uses: Unluckyathecking/kimi-code-reviewer@7758f2496108504eaaa8069d8199900a57d95979
        with:
          kimi_api_key: ${{ secrets.MOONSHOT_API_KEY }}
          fail_on: warning
          autofix: false
