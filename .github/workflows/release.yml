name: release

# Builds and packs a release tarball on version tags. This does NOT publish to
# npm: the registry name "pi-forge" belongs to an unrelated package, so a
# publish from here could never ship this project. If npm distribution is ever
# wanted, pick a scoped name first and restore a publish step against it.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: build and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install
        run: npm ci

      - name: Quality gates
        run: |
          npm run typecheck
          npm run lint
          npm run test:coverage

      - name: Build
        run: npm run build:clean

      - name: Verify dist contents
        run: |
          test -f dist/cli/index.js
          test -f dist/core/orchestrator.js

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Pack
        run: npm pack

      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-tarball
          path: pi-forge-*.tgz
          retention-days: 30
